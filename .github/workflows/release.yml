name: Release

# Manually triggered: builds ZFlash for Linux, Windows and macOS, creates the
# GitHub release and uploads the packages to it. By default the Windows
# installer is signed through Azure Artifact Signing and the macOS DMG is
# signed with ZEDEDA's Developer ID and notarized; both jobs wait for an
# approval of the zflash-release environment.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (default v<version from src/CMakeLists.txt>)
        required: false
        type: string
      draft:
        description: Create the release as a draft
        type: boolean
        default: true
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false
      sign:
        description: Sign the Windows and macOS packages (needs approval of the zflash-release environment)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine version and tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          ver=$(sed -nE 's/^set\(IMAGER_VERSION_(MAJOR|MINOR|PATCH) ([0-9]+)\)/\2/p' src/CMakeLists.txt | paste -sd. -)
          tag="${TAG_INPUT:-v$ver}"
          echo "Version: $ver, tag: $tag, commit: $GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Delete it or pick another tag."
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: prepare
    permissions:
      contents: read
      # Lets the Windows job sign in to Azure Artifact Signing with OIDC.
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      sign: ${{ inputs.sign }}
    secrets: inherit

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: zflash-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
          NOTARIZATION: ${{ needs.build.outputs.macos-notarization }}
          SUBMISSION: ${{ needs.build.outputs.macos-submission }}
        run: |
          flags=()
          notes=""
          [ "$DRAFT" = "true" ] && flags+=(--draft)
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          if [ "$NOTARIZATION" = "pending" ]; then
            # The DMG is signed but Apple has not finished notarizing it, so
            # Gatekeeper would still block it: never publish it like this.
            [ "$DRAFT" = "true" ] || echo "::warning::Created as a draft: Apple is still notarizing the macOS DMG."
            [ "$DRAFT" = "true" ] || flags+=(--draft)
            notes=$(printf '%s\n' \
              "<!-- zflash-notarization-pending: $SUBMISSION -->" \
              "> [!WARNING]" \
              "> Apple is still notarizing the macOS DMG (submission \`$SUBMISSION\`). Run the **Finish macOS notarization** workflow with tag \`$TAG\` before publishing; it staples the DMG and removes this note." \
              "<!-- /zflash-notarization-pending -->" "")
          fi
          # Creates the tag on the built commit if it does not exist yet.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ZFlash $VERSION" \
            --notes "$notes" \
            --generate-notes \
            "${flags[@]}"
