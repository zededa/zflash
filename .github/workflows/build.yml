name: Build

# Builds ZFlash for Linux (AppImage), Windows (installer) and macOS (DMG).
# Runs on every pull request, and is reused by the release workflow.

on:
  pull_request:
  workflow_call:
    inputs:
      sign-windows:
        description: Sign the Windows binaries (needs the WINDOWS_SIGNING_PFX secrets)
        type: boolean
        default: false
    secrets:
      WINDOWS_SIGNING_PFX:
        description: Base64-encoded .pfx code signing certificate
        required: false
      WINDOWS_SIGNING_PFX_PASSWORD:
        description: Password of the .pfx
        required: false

permissions:
  contents: read

concurrency:
  # Cancel superseded PR builds; never cancel release builds (unique run_id).
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Qt >= 6.9.2 is needed on macOS: older releases link the AGL framework,
  # which the Xcode 26 SDK no longer ships.
  QT_VERSION: "6.9.3"

jobs:
  linux:
    name: Linux (x86_64 AppImage)
    # Oldest supported runner: the AppImage only runs on glibc >= the build host's.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential g++-12 cmake git file curl libfuse2 \
            libgnutls28-dev libdrm-dev libgl1-mesa-dev libegl1 libopengl0 \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1 \
            libfontconfig1 libdbus-1-3

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Build AppImage
        env:
          CC: gcc-12
          CXX: g++-12
        run: ./create-appimage.sh --arch=x86_64 --qt-root="$QT_ROOT_DIR"

      - name: Collect artifact
        run: |
          mkdir -p dist
          mv ZFlash-*-x86_64.AppImage dist/
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: zflash-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (x64 installer)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Import signing certificate
        id: cert
        if: inputs.sign-windows
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) { throw "sign-windows requested but the WINDOWS_SIGNING_PFX secret is not set" }
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $pw = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -Password $pw -CertStoreLocation Cert:\CurrentUser\My |
                  Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          Remove-Item $pfx
          if (-not $cert) { throw "No certificate with a private key found in WINDOWS_SIGNING_PFX" }
          Write-Host "Signing with $($cert.Subject) ($($cert.Thumbprint))"
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        env:
          THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
        run: |
          $mingw = Join-Path $env:RUNNER_WORKSPACE "Qt\Tools\mingw1310_64"
          if (-not (Test-Path "$mingw\bin\g++.exe")) { throw "MinGW not found at $mingw" }
          # Put Qt's MinGW first so the runner's other GCC toolchains are not picked up.
          $env:PATH = "$mingw\bin;$env:PATH"

          $cmakeArgs = @(
            "-S", "src", "-B", "build", "-G", "MinGW Makefiles",
            "-DCMAKE_BUILD_TYPE=MinSizeRel",
            "-DCMAKE_C_COMPILER=$mingw\bin\gcc.exe",
            "-DCMAKE_CXX_COMPILER=$mingw\bin\g++.exe",
            "-DQt6_ROOT=$env:QT_ROOT_DIR",
            "-DMINGW64_ROOT=$mingw",
            "-DENABLE_INNO_INSTALLER=ON"
          )
          if ($env:THUMBPRINT) {
            $cmakeArgs += @("-DIMAGER_SIGNED_APP=ON", "-DIMAGER_SIGN_CERT_SHA1=$env:THUMBPRINT")
          }
          cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
          cmake --build build --target inno_installer -j 4
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - name: Collect artifact
        shell: bash
        run: |
          ver=$(sed -nE 's/^set\(IMAGER_VERSION_(MAJOR|MINOR|PATCH) ([0-9]+)\)/\2/p' src/CMakeLists.txt | paste -sd. -)
          mkdir -p dist
          mv build/installer/imager-*.exe "dist/ZFlash-${ver}-windows-x64-setup.exe"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: zflash-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS (universal DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Build DMG
        run: |
          cmake -S src -B build -DCMAKE_BUILD_TYPE=MinSizeRel -DQt6_ROOT="$QT_ROOT_DIR"
          cmake --build build -j "$(sysctl -n hw.ncpu)"
          cmake --build build --target dmg

      - name: Collect artifact
        run: |
          ver=$(sed -nE 's/^set\(IMAGER_VERSION_(MAJOR|MINOR|PATCH) ([0-9]+)\)/\2/p' src/CMakeLists.txt | paste -sd. -)
          mkdir -p dist
          mv "build/ZFlash Imager-${ver}.dmg" "dist/ZFlash-${ver}-macos-universal.dmg"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: zflash-macos-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 14
