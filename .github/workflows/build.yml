name: Build

# Builds ZFlash for Linux (AppImage), Windows (installer) and macOS (DMG).
# Runs on every pull request, and is reused by the release workflow.
#
# With sign: true the Windows and macOS jobs run in the zflash-release
# environment (which needs an approval) and sign with ZEDEDA's certificates:
# Windows through Azure Artifact Signing, macOS with the Developer ID and
# Apple notarization. Pull request builds are never signed.

on:
  pull_request:
  workflow_call:
    inputs:
      sign:
        description: Sign the Windows and macOS packages (zflash-release environment)
        type: boolean
        default: false
    outputs:
      macos-notarization:
        description: "notarized, pending (Apple still reviewing) or unsigned"
        value: ${{ jobs.macos.outputs.notarization }}
      macos-submission:
        description: Apple notary submission ID of the macOS DMG
        value: ${{ jobs.macos.outputs.submission }}

permissions:
  contents: read

concurrency:
  # Cancel superseded PR builds; never cancel release builds (unique run_id).
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Qt >= 6.9.2 is needed on macOS: older releases link the AGL framework,
  # which the Xcode 26 SDK no longer ships.
  QT_VERSION: "6.9.3"

jobs:
  linux:
    name: Linux (x86_64 AppImage)
    # Oldest supported runner: the AppImage only runs on glibc >= the build host's.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential g++-12 cmake git file curl libfuse2 \
            libgnutls28-dev libdrm-dev libgl1-mesa-dev libegl1 libopengl0 \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1 \
            libfontconfig1 libdbus-1-3

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Build AppImage
        env:
          CC: gcc-12
          CXX: g++-12
        run: ./create-appimage.sh --arch=x86_64 --qt-root="$QT_ROOT_DIR"

      - name: Collect artifact
        run: |
          mkdir -p dist
          mv ZFlash-*-x86_64.AppImage dist/
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: zflash-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (x64 installer)
    runs-on: windows-2022
    environment: ${{ inputs.sign && 'zflash-release' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      SIGN: ${{ inputs.sign && 'true' || 'false' }}
      # Pinned versions of the Azure signing client and of a signtool new
      # enough to load it (needs Windows SDK 10.0.22621.755 or later).
      ARTIFACT_SIGNING_CLIENT_VERSION: "1.0.151"
      SDK_BUILD_TOOLS_VERSION: "10.0.28000.2957"
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Sign in to Azure
        if: inputs.sign
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Prepare Azure Artifact Signing
        id: signing
        if: inputs.sign
        shell: pwsh
        env:
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'AZURE_SIGN_ENDPOINT','AZURE_SIGN_ACCOUNT','AZURE_SIGN_PROFILE') {
            if (-not (Get-Item "env:$name").Value) { throw "$name is not set on the zflash-release environment" }
          }
          # Inno Setup passes the signing command line unquoted: keep these paths free of spaces.
          $tools = Join-Path $env:RUNNER_TEMP 'signing'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          function Get-Package($id, $version) {
            $dir = Join-Path $tools $id
            $pkg = "$dir.zip"
            Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/$($id.ToLower())/$version/$($id.ToLower()).$version.nupkg" -OutFile $pkg
            Expand-Archive -Path $pkg -DestinationPath $dir -Force
            Remove-Item $pkg
            return $dir
          }
          $client = Get-Package 'Microsoft.ArtifactSigning.Client' $env:ARTIFACT_SIGNING_CLIENT_VERSION
          $sdk = Get-Package 'Microsoft.Windows.SDK.BuildTools' $env:SDK_BUILD_TOOLS_VERSION
          $dlib = Join-Path $client 'bin\x64\Azure.CodeSigning.Dlib.dll'
          $signtool = Get-ChildItem -Path (Join-Path $sdk 'bin') -Recurse -Filter signtool.exe |
                      Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if (-not (Test-Path $dlib)) { throw "Azure.CodeSigning.Dlib.dll not found in the signing client package" }
          if (-not $signtool) { throw "signtool.exe not found in the SDK build tools package" }
          # Only the Azure CLI sign-in from the previous step is used.
          $metadata = Join-Path $tools 'metadata.json'
          @{
            Endpoint               = $env:AZURE_SIGN_ENDPOINT
            CodeSigningAccountName = $env:AZURE_SIGN_ACCOUNT
            CertificateProfileName = $env:AZURE_SIGN_PROFILE
            ExcludeCredentials     = @(
              'EnvironmentCredential', 'WorkloadIdentityCredential', 'ManagedIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8
          Write-Host "signtool: $($signtool.FullName)"
          "signtool=$($signtool.FullName)" >> $env:GITHUB_OUTPUT
          "dlib=$dlib" >> $env:GITHUB_OUTPUT
          "metadata=$metadata" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        env:
          SIGNTOOL: ${{ steps.signing.outputs.signtool }}
          SIGN_DLIB: ${{ steps.signing.outputs.dlib }}
          SIGN_METADATA: ${{ steps.signing.outputs.metadata }}
        run: |
          $mingw = Join-Path $env:RUNNER_WORKSPACE "Qt\Tools\mingw1310_64"
          if (-not (Test-Path "$mingw\bin\g++.exe")) { throw "MinGW not found at $mingw" }
          # Put Qt's MinGW first so the runner's other GCC toolchains are not picked up.
          $env:PATH = "$mingw\bin;$env:PATH"

          $cmakeArgs = @(
            "-S", "src", "-B", "build", "-G", "MinGW Makefiles",
            "-DCMAKE_BUILD_TYPE=MinSizeRel",
            "-DCMAKE_C_COMPILER=$mingw\bin\gcc.exe",
            "-DCMAKE_CXX_COMPILER=$mingw\bin\g++.exe",
            "-DQt6_ROOT=$env:QT_ROOT_DIR",
            "-DMINGW64_ROOT=$mingw",
            "-DENABLE_INNO_INSTALLER=ON"
          )
          if ($env:SIGN -eq 'true') {
            $cmakeArgs += @(
              "-DIMAGER_SIGNED_APP=ON",
              "-DSIGNTOOL=$env:SIGNTOOL",
              "-DIMAGER_SIGN_DLIB=$env:SIGN_DLIB",
              "-DIMAGER_SIGN_DLIB_METADATA=$env:SIGN_METADATA",
              "-DIMAGER_SIGN_TIMESTAMP_URL=http://timestamp.acs.microsoft.com"
            )
          }
          cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
          cmake --build build --target inno_installer -j 4
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - name: Collect artifact
        shell: bash
        run: |
          ver=$(sed -nE 's/^set\(IMAGER_VERSION_(MAJOR|MINOR|PATCH) ([0-9]+)\)/\2/p' src/CMakeLists.txt | paste -sd. -)
          mkdir -p dist
          mv build/installer/imager-*.exe "dist/ZFlash-${ver}-windows-x64-setup.exe"
          ls -l dist

      - name: Check the signatures
        if: inputs.sign
        shell: powershell
        env:
          EXPECTED_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:EXPECTED_PUBLISHER) { throw "WINDOWS_PUBLISHER is not set on the zflash-release environment" }
          $files = @(Get-ChildItem dist -Filter '*-setup.exe') + @(Get-Item build\deploy\zflash.exe)
          $failed = 0
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -FilePath $file.FullName
            $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '(none)' }
            Write-Host "$($file.Name): $($sig.Status), signer: $subject, timestamped: $([bool]$sig.TimeStamperCertificate)"
            if ($sig.Status -ne 'Valid' -or $subject -ne $env:EXPECTED_PUBLISHER -or -not $sig.TimeStamperCertificate) { $failed++ }
          }
          if ($failed) { throw "$failed file(s) failed the signature check" }

      - uses: actions/upload-artifact@v7
        with:
          name: zflash-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS (universal DMG)
    runs-on: macos-latest
    environment: ${{ inputs.sign && 'zflash-release' || '' }}
    outputs:
      notarization: ${{ steps.notary.outputs.status || 'unsigned' }}
      submission: ${{ steps.notary.outputs.submission }}
    env:
      SIGN: ${{ inputs.sign && 'true' || 'false' }}
      # How long the job waits for Apple. A new app can be held for
      # "in-depth analysis" for hours or days; the release then stays a draft
      # and the "Finish macOS notarization" workflow completes it later.
      NOTARY_WAIT: 20m
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Import the Developer ID certificate
        id: cert
        if: inputs.sign
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::$name is not set on the zflash-release environment"; exit 1; }
          done
          brew install create-dmg
          # A keychain of this job's own, removed in the last step.
          kc="$RUNNER_TEMP/zflash-signing.keychain-db"
          kcpw=$(openssl rand -hex 24)
          p12="$RUNNER_TEMP/zflash-signing.p12"
          trap 'rm -f "$p12"' EXIT
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$CSC_LINK" | base64 --decode > "$p12"
          security import "$p12" -k "$kc" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$kc" | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -1)
          [ -n "$identity" ] || { echo "::error::No Developer ID Application identity in CSC_LINK"; exit 1; }
          echo "Signing as: $identity"
          echo "keychain=$kc" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          args=(-S src -B build -DCMAKE_BUILD_TYPE=MinSizeRel -DQt6_ROOT="$QT_ROOT_DIR")
          if [ "$SIGN" = "true" ]; then
            args+=(-DIMAGER_SIGNED_APP=ON -DIMAGER_SIGNING_IDENTITY="$IDENTITY")
          fi
          cmake "${args[@]}"
          cmake --build build -j "$(sysctl -n hw.ncpu)"
          cmake --build build --target dmg

      - name: Collect artifact
        run: |
          ver=$(sed -nE 's/^set\(IMAGER_VERSION_(MAJOR|MINOR|PATCH) ([0-9]+)\)/\2/p' src/CMakeLists.txt | paste -sd. -)
          mkdir -p dist
          mv "build/ZFlash Imager-${ver}.dmg" "dist/ZFlash-${ver}-macos-universal.dmg"
          ls -l dist

      - name: Notarize
        id: notary
        if: inputs.sign
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || { echo "::error::$name is not set on the zflash-release environment"; exit 1; }
          done
          key="$RUNNER_TEMP/zflash-notary.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          auth=(--key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          dmg=$(ls dist/*.dmg)
          field() { python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))[sys.argv[2]])' "$@"; }

          xcrun notarytool submit "$dmg" "${auth[@]}" --output-format json > submit.json
          id=$(field submit.json id)
          echo "Submitted to Apple: $id"
          echo "submission=$id" >> "$GITHUB_OUTPUT"

          # Waits at most NOTARY_WAIT; Apple keeps reviewing after a timeout.
          xcrun notarytool wait "$id" "${auth[@]}" --timeout "$NOTARY_WAIT" || true
          xcrun notarytool info "$id" "${auth[@]}" --output-format json > info.json
          status=$(field info.json status)
          echo "Apple status: $status"
          case "$status" in
            Accepted)
              xcrun stapler staple "$dmg"
              echo "status=notarized" >> "$GITHUB_OUTPUT"
              ;;
            "In Progress")
              echo "::warning::Apple is still reviewing the DMG (submission $id). The release stays a draft; run the 'Finish macOS notarization' workflow later."
              echo "status=pending" >> "$GITHUB_OUTPUT"
              ;;
            *)
              xcrun notarytool log "$id" "${auth[@]}" || true
              echo "::error::Notarization ended with status $status"
              exit 1
              ;;
          esac

      - name: Check the signatures
        if: inputs.sign
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
          NOTARIZATION: ${{ steps.notary.outputs.status }}
        run: |
          set -euo pipefail
          dmg=$(ls dist/*.dmg)
          codesign --verify --strict --verbose=2 "$dmg"
          codesign -dvv "$dmg" 2>&1 | grep -qF "Authority=$IDENTITY" || { echo "::error::DMG is not signed by $IDENTITY"; exit 1; }
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mnt" "$dmg" >/dev/null
          trap 'hdiutil detach "$mnt" >/dev/null || true' EXIT
          app=$(ls -d "$mnt"/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -qF "Authority=$IDENTITY" || { echo "::error::App is not signed by $IDENTITY"; exit 1; }
          # Gatekeeper accepts the DMG only once it is notarized.
          if [ "$NOTARIZATION" = "notarized" ]; then
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature -vv "$dmg"
            spctl --assess --type execute -vv "$app"
          else
            echo "Notarization pending: the Gatekeeper checks run in 'Finish macOS notarization'."
          fi

      - name: Remove the signing keychain
        if: always() && steps.cert.outputs.keychain
        env:
          KEYCHAIN: ${{ steps.cert.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN" || true

      - uses: actions/upload-artifact@v7
        with:
          name: zflash-macos-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 14
